overview: "Track what you want to watch, get it, and reclaim the disk when you are done."
description: >
  One entry per title, with or without a media file. Entries live in this plugin's own database
  and appear inside your existing Movies and TV libraries: a wishlist for what you do not have,
  acquisition for getting it, and retention for reclaiming the disk once you are finished —
  while the entry, its artwork and its watch history stay.
